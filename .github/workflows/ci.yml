name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 3.2
          - 3.3
          - 3.4
          - "4.0"
        resque-version:
          - 2
          - 3
        rack-version:
          - 2
          - 3
        exclude:
          - ruby-version: "4.0"
            rack-version: 2
    env:
      RESQUE_VERSION: "${{ matrix.resque-version }}"
      RACK_VERSION: "${{ matrix.rack-version }}"

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ matrix.ruby-version }}"
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: bundle exec rake
